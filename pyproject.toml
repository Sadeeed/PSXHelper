[project]
name = "psxhelper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sadeeed", email = "sadeeedw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
psxhelper = "psxhelper:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
